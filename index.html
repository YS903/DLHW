<!DOCTYPE html>
<html>

<head>
    <title>English App</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "associated with" mean?</p>

    <button onclick="checkAnswer('related')">
        Related to
    </button>

    <button onclick="checkAnswer('participate')">
        Participate in
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>

    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "related") {
                document.getElementById("feedback").innerText =
                    "베리굿";
            }

            else {
                document.getElementById("feedback").innerText =
                    "다시 생각해";
            }

        }

    </script>

</body>
</html>

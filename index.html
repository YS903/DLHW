```html
<!DOCTYPE html>
<html>

<head>
    <title>My First English Learning App</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Vocabulary Quiz</h1>

    <p>What does "associated with" mean?</p>

    <button onclick="checkAnswer('related')">
        Related to
    </button>

    <button onclick="checkAnswer('avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <script>

        function checkAnswer(answer) {

            if (answer === "related") {
                document.getElementById("feedback").innerText =
                    "Correct! Well done!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is Related to.";
            }

        }

    </script>

</body>
</html>
```
